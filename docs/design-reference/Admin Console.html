<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MLDA Collective — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700;6..96,800;6..96,900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0908; --panel:#121110; --panel-2:#16140f; --panel-3:#1d1a15;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.13);
    --gold:#c8a464; --gold-soft:rgba(200,164,100,.13);
    --teal:#2c9089; --teal-bright:#3aa89f; --teal-soft:rgba(44,144,137,.15); --teal-line:rgba(58,168,159,.35);
    --coral:#d97a5e; --coral-soft:rgba(217,122,94,.14);
    --purple:#7c6fcf; --blue:#5a9bd4; --pink:#cf6f9c;
    --bone:#efe9df; --muted:#a89e90; --muted-2:#7d756a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{ background:var(--bg); font-family:'Archivo',system-ui,sans-serif; color:var(--bone); overflow:hidden; }
  .serif{ font-family:'Bodoni Moda',serif; }
  .app{ display:flex; height:100vh; min-width:1080px; }

  /* sidebar */
  .side{ width:238px; flex:0 0 238px; background:#0d0c0b; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:22px 16px; }
  .brand{ display:flex; align-items:center; gap:11px; padding:6px 8px 22px; }
  .brand .mark{ width:38px; height:38px; border-radius:11px; background:linear-gradient(150deg,var(--gold),#9c7a3c); color:#1a1408; display:flex; align-items:center; justify-content:center; font-family:'Bodoni Moda',serif; font-weight:700; font-size:20px; }
  .brand .nm{ font-family:'Bodoni Moda',serif; font-size:17px; font-weight:600; line-height:1; }
  .brand .sub{ font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted-2); margin-top:3px; }
  .navlbl{ font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted-2); padding:14px 10px 8px; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .navitem{ display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:10px; border:0; background:none; color:var(--muted); font-family:inherit; font-size:13.5px; cursor:pointer; text-align:left; width:100%; transition:.15s; }
  .navitem:hover{ background:var(--panel-2); color:var(--bone); }
  .navitem.on{ background:var(--teal-soft); color:var(--bone); }
  .navitem.on svg{ color:var(--teal-bright); }
  .navitem svg{ width:19px; height:19px; color:var(--muted-2); flex:0 0 19px; }
  .navitem .badge{ margin-left:auto; font-size:10px; background:var(--coral); color:#1a0d08; border-radius:20px; padding:1px 7px; font-weight:700; }
  .side-foot{ margin-top:auto; display:flex; align-items:center; gap:10px; padding:11px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); }

  /* main */
  .main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar{ height:64px; flex:0 0 64px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:0 28px; background:var(--bg); }
  .topbar .search{ display:flex; align-items:center; gap:10px; background:var(--panel-2); border:1px solid var(--line); border-radius:30px; padding:9px 15px; width:300px; }
  .topbar .search input{ background:none; border:0; color:var(--bone); font-family:inherit; font-size:13px; outline:none; flex:1; }
  .topbar .search input::placeholder{ color:var(--muted-2); }
  .iconbtn{ width:38px; height:38px; border-radius:11px; background:var(--panel-2); border:1px solid var(--line); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; }
  .canvas{ flex:1; overflow-y:auto; padding:28px; }
  .canvas::-webkit-scrollbar{ width:9px; } .canvas::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:9px; }

  .eyebrow{ font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .eyebrow.teal{ color:var(--teal-bright); } .eyebrow.mut{ color:var(--muted-2); }
  .h1{ font-family:'Bodoni Moda',serif; font-size:30px; font-weight:600; margin-top:5px; letter-spacing:-.01em; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:16px; }
  .chip{ font-size:11px; padding:3px 10px; border-radius:20px; background:rgba(255,255,255,.06); color:var(--muted); }
  .btn{ background:var(--teal); color:#06110f; border:0; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn.ghost{ background:var(--panel-2); border:1px solid var(--line-2); color:var(--bone); font-weight:600; }
  .btn.gold{ background:var(--gold); color:#241c0a; }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .kpi{ padding:18px 20px; }
  .kpi .lbl{ font-size:11.5px; color:var(--muted-2); }
  .kpi .val{ font-family:'Bodoni Moda',serif; font-size:34px; font-weight:600; margin:6px 0 4px; }
  .kpi .trend{ font-size:11.5px; display:flex; align-items:center; gap:4px; }
  .up{ color:var(--teal-bright); } .down{ color:var(--coral); }

  .grid-2{ display:grid; grid-template-columns:1.55fr 1fr; gap:18px; margin-top:18px; }
  .sec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sec-title{ font-size:15px; font-weight:700; }

  /* schedule grid */
  .schedwrap{ display:flex; gap:0; position:relative; }
  .timecol{ width:54px; flex:0 0 54px; padding-top:42px; }
  .timecol .tlabel{ font-size:10.5px; color:var(--muted-2); text-align:right; padding-right:10px; transform:translateY(-7px); }
  .studiocol{ flex:1; border-left:1px solid var(--line); position:relative; }
  .studiohead{ height:42px; display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2; }
  .gridbody{ position:relative; }
  .hline{ position:absolute; left:0; right:0; border-top:1px solid var(--line); }
  .block{ position:absolute; left:5px; right:5px; border-radius:9px; padding:7px 9px; cursor:pointer; overflow:hidden; border-left:3px solid; transition:transform .12s, filter .12s; }
  .block:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .block .bn{ font-size:11.5px; font-weight:700; line-height:1.15; }
  .block .bm{ font-size:10px; opacity:.8; margin-top:2px; }

  /* table */
  .row{ display:grid; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line); font-size:13px; }
  .row:last-child{ border-bottom:0; }
  .caphar{ height:7px; border-radius:6px; background:var(--panel-3); overflow:hidden; }
  .caphar > i{ display:block; height:100%; border-radius:6px; }

  .alert{ display:flex; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .alert:last-child{ border-bottom:0; }
  .alert .ic{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 34px; }

  .toast{ position:fixed; right:28px; bottom:28px; z-index:90; background:var(--teal); color:#06110f; border-radius:12px; padding:13px 18px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:9px; box-shadow:0 16px 40px -14px rgba(44,144,137,.8); animation:up .3s ease both; }
  @keyframes up{ from{transform:translateY(16px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:80; display:flex; align-items:center; justify-content:center; animation:fade .2s ease both; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  .modal{ width:440px; background:var(--panel); border:1px solid var(--line-2); border-radius:18px; padding:24px; animation:up .25s ease both; }
  .fade-in{ animation:fade .3s ease both; }
  .av{ border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Bodoni Moda',serif; font-weight:600; color:#0a0908; flex:0 0 auto; }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const AI={
  grid:<g><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>,
  cal:<g><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></g>,
  enroll:<g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></g>,
  users:<g><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.5a3.4 3.4 0 0 1 0 6.5M17 15c2.4.4 4 1.9 4 5"/></g>,
  staff:<g><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></g>,
  dollar:<g><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></g>,
  bell:<g><path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 20a2 2 0 0 0 4 0"/></g>,
  search:<g><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></g>,
  plus:<path d="M12 5v14M5 12h14"/>,
  up:<path d="M7 17L17 7M9 7h8v8"/>,
  shirt:<path d="M16 3l4 3-2 4-2-1v12H8V9L6 10 4 6l4-3 2 2h4z"/>,
  warn:<g><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></g>,
  swap:<g><path d="M4 7h13l-3-3M20 17H7l3 3"/></g>,
  trophy:<g><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M9 14h6M10 14v3M14 14v3M8 21h8"/></g>,
  chev:<path d="M9 6l6 6-6 6"/>,
  check:<path d="M5 12l5 5L20 6"/>,
  send:<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>,
  x:<path d="M6 6l12 12M18 6L6 18"/>,
};
const Icon=({n,w=20,sw=1.7,fill="none",style})=><svg viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{width:w,height:w,...style}}>{AI[n]}</svg>;

const STY={Ballet:'#2c9089',Contemporary:'#7c6fcf',Jazz:'#c8a464',HipHop:'#d97a5e',Tap:'#5a9bd4',Lyrical:'#cf6f9c',Production:'#7d756a'};
function tint(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function initials(n){const p=n.split(' ');return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function avColor(n){const c=['#2c9089','#c8a464','#d97a5e','#7c6fcf','#5a9bd4','#cf6f9c'];let s=0;for(const ch of n)s+=ch.charCodeAt(0);return c[s%c.length];}
function Av({n,size=34}){return <div className="av" style={{width:size,height:size,background:avColor(n),fontSize:size*0.4}}>{initials(n)}</div>;}

/* ---- data ---- */
const STUDIOS=['Studio A','Studio B','Studio C','Main Stage'];
const SCHED={
  'Studio A':[[0,90,'Competition Jazz','Ms. Renée','Senior','Jazz'],[90,90,'Company Contemporary','Mr. Théo','Company','Contemporary'],[180,60,'Hip-Hop','DJ Marcus','Teen','HipHop']],
  'Studio B':[[30,60,'Ballet Technique','Ms. Elena','Sr Elite','Ballet'],[105,75,'Pointe','Ms. Elena','Senior','Ballet'],[195,60,'Variations','Ms. Elena','Company','Ballet']],
  'Studio C':[[0,60,'Petite Jazz','Ms. Joy','Petite','Jazz'],[105,90,'Lyrical Ensemble','Ms. Renée','Junior','Lyrical'],[210,60,'Tap','Coach Bri','Teen','Tap']],
  'Main Stage':[[0,120,'Company Rehearsal','Mr. Théo','Company','Contemporary'],[150,90,'Production Run','Studio Team','All','Production']],
};
const GST=16*60, PX=1.18, COLH=270*PX;

const ENROLL=[
  ['Competition Jazz','Senior','Mon 4:00','Ms. Renée',18,20,2,'Jazz'],
  ['Company Contemporary','Company','Mon 5:30','Mr. Théo',14,16,0,'Contemporary'],
  ['Ballet Technique','Sr Elite','Mon 4:30','Ms. Elena',12,14,0,'Ballet'],
  ['Petite Jazz','Petite','Mon 4:00','Ms. Joy',10,10,4,'Jazz'],
  ['Lyrical Ensemble','Junior','Mon 5:45','Ms. Renée',11,14,0,'Lyrical'],
  ['Hip-Hop','Teen','Mon 7:00','DJ Marcus',16,24,0,'HipHop'],
  ['Pointe','Senior','Wed 4:30','Ms. Elena',9,12,0,'Ballet'],
  ['Tap','Teen','Sat 10:00','Coach Bri',7,16,0,'Tap'],
];
const NEWREG=[['Harper Lin','Competition Jazz','12m'],['Isla Ford','Ballet Technique','1h'],['Wren Avery','Petite Jazz','3h'],['Maya Cohen','Lyrical Ensemble','5h']];

const STAFF=[
  ['Ms. Elena Vasquez','Ballet · Pointe',7,42,'Thu',0],
  ['Mr. Théo Laurent','Contemporary',6,38,'—',0],
  ['Ms. Renée Adams','Jazz · Lyrical',8,51,'Sun',1],
  ['Ms. Joy Kim','Petite Program',5,26,'Wed/Thu',0],
  ['DJ Marcus','Hip-Hop',4,29,'Mon/Tue',0],
  ['Coach Bri','Tap · Tumbling',4,22,'Fri',0],
];

const ALERTS=[
  ['warn','var(--coral)','Sub needed Friday','Ms. Renée out — Lyrical Ensemble (5:45) needs coverage','Find sub'],
  ['shirt','var(--gold)','7 costume balances outstanding','$1,015 across Nationals routines — due this Friday','Send reminder'],
  ['users','var(--teal-bright)','Petite Jazz waitlist at 4','Class is full. A 2nd section could open 10 spots.','Open section'],
  ['trophy','var(--gold)','Nationals registration closes in 5 days','3 routines still need final entry forms submitted','Review entries'],
];

/* ---- KPI ---- */
function Dashboard({setToast, go, setModal}){
  return (
    <div className="fade-in">
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between'}}>
        <div><div className="eyebrow">Monday · June 16 · Summer Intensive Season</div><div className="h1">Studio overview</div></div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn ghost" onClick={()=>go('comms')}><Icon n="send" w={15}/>Broadcast</button>
          <button className="btn" onClick={()=>go('enroll')}><Icon n="plus" w={15} fill="none"/>New registration</button>
        </div>
      </div>

      <div className="kpis" style={{marginTop:22}}>
        {[['Active dancers','312','up','+18 this season'],['Revenue · June','$284.5k','up','+12% vs May'],['Avg attendance','94%','up','+2 pts'],['Open spots','23','down','across 8 classes']].map((k,i)=>(
          <div key={i} className="panel kpi">
            <div className="lbl">{k[0]}</div>
            <div className="val" style={{color:i===1?'var(--gold)':'var(--bone)'}}>{k[1]}</div>
            <div className={'trend '+(k[2]==='up'?'up':'down')}><Icon n="up" w={13} style={{transform:k[2]==='down'?'scaleY(-1)':'none'}}/>{k[3]}</div>
          </div>
        ))}
      </div>

      <div className="grid-2">
        {/* today schedule */}
        <div className="panel" style={{padding:18}}>
          <div className="sec-head">
            <div><div className="sec-title">Today across the studios</div><div style={{fontSize:11.5,color:'var(--muted-2)',marginTop:2}}>Mon · 4:00–8:30 PM</div></div>
            <button className="btn ghost" style={{padding:'7px 12px',fontSize:12}} onClick={()=>go('sched')}>Full schedule</button>
          </div>
          <ScheduleGrid compact setModal={setModal}/>
        </div>
        {/* right rail */}
        <div style={{display:'flex',flexDirection:'column',gap:18}}>
          <div className="panel">
            <div className="sec-head" style={{padding:'15px 16px 0'}}><div className="sec-title">Needs attention</div><span className="chip" style={{background:'var(--coral-soft)',color:'var(--coral)'}}>{ALERTS.length}</span></div>
            <div style={{marginTop:10}}>
              {ALERTS.map((a,i)=>(
                <div key={i} className="alert">
                  <div className="ic" style={{backgroundColor:a[1]==='var(--gold)'?'var(--gold-soft)':a[1]==='var(--coral)'?'var(--coral-soft)':'var(--teal-soft)',color:a[1]}}><Icon n={a[0]} w={17}/></div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600}}>{a[2]}</div>
                    <div style={{fontSize:11.5,color:'var(--muted-2)',marginTop:2,lineHeight:1.4}}>{a[3]}</div>
                    <button onClick={()=>setToast(a[4]+' — done')} style={{marginTop:7,background:'none',border:0,color:a[1],fontSize:11.5,fontWeight:700,fontFamily:'inherit',cursor:'pointer',padding:0}}>{a[4]} →</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="panel" style={{padding:'15px 16px'}}>
            <div className="sec-head"><div className="sec-title">Recent registrations</div><button onClick={()=>go('enroll')} style={{background:'none',border:0,color:'var(--teal-bright)',fontSize:11.5,fontFamily:'inherit',cursor:'pointer'}}>View all</button></div>
            <div style={{display:'flex',flexDirection:'column',gap:11,marginTop:4}}>
              {NEWREG.map((r,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:11}}>
                  <Av n={r[0]} size={32}/>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{r[0]}</div><div style={{fontSize:11,color:'var(--muted-2)'}}>{r[1]}</div></div>
                  <span style={{fontSize:11,color:'var(--muted-2)'}}>{r[2]}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---- schedule grid ---- */
function ScheduleGrid({setModal}){
  const labels=[]; for(let m=0;m<=270;m+=30){ const tot=GST+m; let h=Math.floor(tot/60), mm=tot%60; const ap=h>=12?'PM':'AM'; h=h%12||12; labels.push([m, `${h}:${mm.toString().padStart(2,'0')}`]); }
  return (
    <div className="schedwrap">
      <div className="timecol">{labels.map(([m,l])=><div key={m} className="tlabel" style={{height: m===270?0:30*PX}}>{l}</div>)}</div>
      {STUDIOS.map(st=>(
        <div key={st} className="studiocol">
          <div className="studiohead">{st}</div>
          <div className="gridbody" style={{height:COLH}}>
            {labels.map(([m])=><div key={m} className="hline" style={{top:m*PX}}/>)}
            {SCHED[st].map((c,i)=>{ const col=STY[c[5]];
              return <div key={i} className="block" onClick={()=>setModal({c,st})} style={{top:c[0]*PX+1,height:c[1]*PX-4,background:tint(col,.16),borderLeftColor:col}}>
                <div className="bn" style={{color:'var(--bone)'}}>{c[2]}</div>
                <div className="bm" style={{color:'var(--muted)'}}>{c[3]} · {c[4]}</div>
              </div>;
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function ScheduleView({setModal}){
  return (
    <div className="fade-in">
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between'}}>
        <div><div className="eyebrow teal">Schedule</div><div className="h1">Monday · studio grid</div></div>
        <div style={{display:'flex',gap:10}}>
          <div style={{display:'flex',gap:4,background:'var(--panel-2)',border:'1px solid var(--line)',borderRadius:30,padding:4}}>
            {['Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=><button key={d} style={{border:0,cursor:'pointer',fontFamily:'inherit',fontSize:12.5,fontWeight:600,padding:'6px 13px',borderRadius:20,background:i===0?'var(--teal)':'none',color:i===0?'#06110f':'var(--muted)'}}>{d}</button>)}
          </div>
          <button className="btn"><Icon n="plus" w={15}/>Add class</button>
        </div>
      </div>
      <div className="panel" style={{padding:18,marginTop:20}}><ScheduleGrid setModal={setModal}/></div>
      <div style={{display:'flex',gap:16,marginTop:14,flexWrap:'wrap'}}>
        {Object.entries(STY).map(([k,v])=><div key={k} style={{display:'flex',alignItems:'center',gap:7,fontSize:11.5,color:'var(--muted)'}}><span style={{width:10,height:10,borderRadius:3,background:v}}/>{k}</div>)}
      </div>
    </div>
  );
}

/* ---- enrollment ---- */
function Enrollment({setToast}){
  const COLS='2fr 1fr 1.2fr 1.4fr 2fr 0.9fr';
  return (
    <div className="fade-in">
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between'}}>
        <div><div className="eyebrow">Enrollment</div><div className="h1">Registration &amp; capacity</div></div>
        <button className="btn"><Icon n="plus" w={15}/>New registration</button>
      </div>
      <div className="kpis" style={{marginTop:20,gridTemplateColumns:'repeat(4,1fr)'}}>
        {[['Registered dancers','312'],['Classes at capacity','3'],['On waitlists','11'],['Trial requests','6']].map((k,i)=>(
          <div key={i} className="panel kpi"><div className="lbl">{k[0]}</div><div className="val" style={{fontSize:30,color:i===1?'var(--gold)':'var(--bone)'}}>{k[1]}</div></div>
        ))}
      </div>
      <div className="panel" style={{marginTop:18,overflow:'hidden'}}>
        <div className="row" style={{gridTemplateColumns:COLS,color:'var(--muted-2)',fontSize:10.5,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:600,background:'var(--panel-2)'}}>
          <div>Class</div><div>Level</div><div>Schedule</div><div>Instructor</div><div>Capacity</div><div></div>
        </div>
        {ENROLL.map((c,i)=>{ const [n,lvl,sch,teach,en,cap,wl,sty]=c; const pct=Math.round(en/cap*100); const full=en>=cap; const col=STY[sty];
          return <div key={i} className="row" style={{gridTemplateColumns:COLS}}>
            <div style={{display:'flex',alignItems:'center',gap:9}}><span style={{width:8,height:8,borderRadius:'50%',background:col}}/><b style={{fontWeight:600}}>{n}</b></div>
            <div style={{color:'var(--muted)'}}>{lvl}</div>
            <div style={{color:'var(--muted)'}}>{sch}</div>
            <div style={{display:'flex',alignItems:'center',gap:8}}><Av n={teach} size={24}/><span style={{color:'var(--muted)'}}>{teach}</span></div>
            <div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,marginBottom:5}}><span style={{color:full?'var(--gold)':'var(--bone)',fontWeight:600}}>{en}/{cap}{full&&' · full'}</span>{wl>0&&<span style={{color:'var(--coral)'}}>+{wl} waitlist</span>}</div>
              <div className="caphar"><i style={{width:pct+'%',background:full?'var(--gold)':col}}/></div>
            </div>
            <div style={{textAlign:'right'}}>
              {full ? <button onClick={()=>setToast('Drafting 2nd section of '+n)} style={{background:'var(--gold-soft)',color:'var(--gold)',border:0,borderRadius:8,padding:'6px 11px',fontSize:11.5,fontWeight:700,fontFamily:'inherit',cursor:'pointer'}}>+ Section</button>
                     : <button onClick={()=>setToast('Opened '+n)} style={{background:'none',border:0,color:'var(--muted-2)',cursor:'pointer'}}><Icon n="chev" w={17}/></button>}
            </div>
          </div>;
        })}
      </div>
    </div>
  );
}

/* ---- staff ---- */
function Staff({setToast}){
  return (
    <div className="fade-in">
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between'}}>
        <div><div className="eyebrow teal">Faculty</div><div className="h1">Teachers &amp; coverage</div></div>
        <button className="btn ghost"><Icon n="swap" w={15}/>Find a sub</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:16,marginTop:20}}>
        {STAFF.map((s,i)=>{ const [nm,sp,cls,dan,av,sub]=s;
          return <div key={i} className="panel" style={{padding:18}}>
            <div style={{display:'flex',alignItems:'center',gap:13}}>
              <Av n={nm} size={48}/>
              <div style={{flex:1}}>
                <div style={{fontSize:15.5,fontWeight:600}}>{nm}</div>
                <div style={{fontSize:12,color:'var(--muted)'}}>{sp}</div>
              </div>
              {sub>0 && <span className="chip" style={{background:'var(--coral-soft)',color:'var(--coral)'}}>{sub} sub request</span>}
            </div>
            <div style={{display:'flex',gap:0,marginTop:16,borderTop:'1px solid var(--line)',paddingTop:14}}>
              {[['Classes',cls],['Dancers',dan],['Open day',av]].map((m,j)=>(
                <div key={j} style={{flex:1,textAlign:'center',borderRight:j<2?'1px solid var(--line)':'none'}}>
                  <div className="serif" style={{fontSize:20,fontWeight:600,color:'var(--teal-bright)'}}>{m[1]}</div>
                  <div style={{fontSize:10.5,color:'var(--muted-2)',marginTop:1}}>{m[0]}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:9,marginTop:14}}>
              <button onClick={()=>setToast('Opened '+nm.split(' ')[0]+'’s schedule')} className="btn ghost" style={{flex:1,justifyContent:'center',padding:'9px',fontSize:12.5}}>View schedule</button>
              {sub>0 ? <button onClick={()=>setToast('Sub coverage assigned for '+nm.split(' ')[0])} className="btn gold" style={{flex:1,justifyContent:'center',padding:'9px',fontSize:12.5}}>Assign sub</button>
                     : <button onClick={()=>setToast('Messaged '+nm.split(' ')[0])} className="btn" style={{flex:1,justifyContent:'center',padding:'9px',fontSize:12.5}}>Message</button>}
            </div>
          </div>;
        })}
      </div>
    </div>
  );
}

/* ---- comms ---- */
function Comms({setToast}){
  const [aud,setAud]=useState('All families');
  const [msg,setMsg]=useState('');
  const auds=['All families','Company only','Competition team','Petite program'];
  return (
    <div className="fade-in" style={{maxWidth:760}}>
      <div className="eyebrow">Communications</div><div className="h1">Send a broadcast</div>
      <div className="panel" style={{padding:22,marginTop:20}}>
        <div className="eyebrow mut" style={{marginBottom:10}}>Audience</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {auds.map(a=><button key={a} onClick={()=>setAud(a)} style={{border:`1px solid ${aud===a?'var(--teal-line)':'var(--line)'}`,background:aud===a?'var(--teal-soft)':'transparent',color:aud===a?'var(--bone)':'var(--muted)',borderRadius:30,padding:'8px 15px',fontSize:13,fontFamily:'inherit',cursor:'pointer'}}>{a}</button>)}
        </div>
        <div className="eyebrow mut" style={{margin:'20px 0 10px'}}>Message</div>
        <textarea value={msg} onChange={e=>setMsg(e.target.value)} rows={5} placeholder="Write your announcement to families…" style={{width:'100%',background:'var(--panel-2)',border:'1px solid var(--line)',borderRadius:12,padding:'14px',color:'var(--bone)',fontFamily:'inherit',fontSize:14,resize:'none',outline:'none',lineHeight:1.5}}/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:16}}>
          <span style={{fontSize:12.5,color:'var(--muted-2)'}}>Goes to <b style={{color:'var(--teal-bright)'}}>{aud}</b> · push + inbox</span>
          <button onClick={()=>{ if(msg.trim()){setToast('Broadcast sent to '+aud); setMsg('');} }} className="btn" style={{padding:'11px 20px'}}><Icon n="send" w={15}/>Send broadcast</button>
        </div>
      </div>
    </div>
  );
}

/* ---- billing ---- */
function Billing(){
  const out=[['Whitman family','$145','Lyrical costume','Overdue'],['Reyes family','$320','June tuition','Due Jun 20'],['Park family','$145','Costume balance','Due Jun 6'],['Cohen family','$210','Privates · May','Due Jun 18']];
  return (
    <div className="fade-in">
      <div className="eyebrow">Billing</div><div className="h1">Revenue &amp; balances</div>
      <div className="kpis" style={{marginTop:20}}>
        {[['Collected · June','$284.5k','--'],['Outstanding','$8,240','gold'],['Autopay families','81%','--'],['Avg / family','$1,920','--']].map((k,i)=>(
          <div key={i} className="panel kpi"><div className="lbl">{k[0]}</div><div className="val" style={{fontSize:30,color:k[2]==='gold'?'var(--gold)':'var(--bone)'}}>{k[1]}</div></div>
        ))}
      </div>
      <div className="panel" style={{marginTop:18,overflow:'hidden'}}>
        <div className="row" style={{gridTemplateColumns:'1.6fr 1fr 1.6fr 1fr',color:'var(--muted-2)',fontSize:10.5,letterSpacing:'.1em',textTransform:'uppercase',fontWeight:600,background:'var(--panel-2)'}}>
          <div>Family</div><div>Amount</div><div>For</div><div>Status</div>
        </div>
        {out.map((r,i)=><div key={i} className="row" style={{gridTemplateColumns:'1.6fr 1fr 1.6fr 1fr'}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}><Av n={r[0]} size={28}/><b style={{fontWeight:600}}>{r[0]}</b></div>
          <div className="serif" style={{fontSize:16}}>{r[1]}</div>
          <div style={{color:'var(--muted)'}}>{r[2]}</div>
          <div><span className="chip" style={{background:r[3]==='Overdue'?'var(--coral-soft)':'var(--gold-soft)',color:r[3]==='Overdue'?'var(--coral)':'var(--gold)'}}>{r[3]}</span></div>
        </div>)}
      </div>
    </div>
  );
}

/* ---- class modal ---- */
function ClassModal({data, close, setToast}){
  const {c,st}=data; const col=STY[c[5]];
  const tot=GST+c[0], end=GST+c[0]+c[1];
  const fmt=m=>{let h=Math.floor(m/60),mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${mm.toString().padStart(2,'0')} ${ap}`;};
  return (
    <div className="modal-bg" onClick={close}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8}}><span style={{width:9,height:9,borderRadius:'50%',background:col}}/><span style={{fontSize:10,letterSpacing:'.14em',textTransform:'uppercase',color:col,fontWeight:600}}>{c[5]}</span></div>
            <div className="serif" style={{fontSize:24,fontWeight:600,marginTop:6}}>{c[2]}</div>
          </div>
          <button onClick={close} style={{background:'var(--panel-2)',border:0,color:'var(--muted)',borderRadius:9,width:32,height:32,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon n="x" w={16}/></button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,margin:'18px 0'}}>
          {[['Time',`${fmt(tot)} – ${fmt(end)}`],['Studio',st],['Level',c[4]],['Instructor',c[3]]].map((r,i)=>(
            <div key={i} style={{background:'var(--panel-2)',borderRadius:11,padding:'11px 13px'}}>
              <div style={{fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--muted-2)'}}>{r[0]}</div>
              <div style={{fontSize:14,fontWeight:600,marginTop:4}}>{r[1]}</div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:9}}>
          <button onClick={()=>{setToast('Reassign teacher for '+c[2]);close();}} className="btn ghost" style={{flex:1,justifyContent:'center'}}><Icon n="swap" w={15}/>Reassign</button>
          <button onClick={()=>{setToast('Opened roster for '+c[2]);close();}} className="btn" style={{flex:1,justifyContent:'center'}}>View roster</button>
        </div>
      </div>
    </div>
  );
}

/* ---- app ---- */
function App(){
  const [view,setView]=useState(()=>localStorage.getItem('mlda_a_view')||'dash');
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  useEffect(()=>{ localStorage.setItem('mlda_a_view',view); },[view]);
  useEffect(()=>{ if(toast){ const t=setTimeout(()=>setToast(null),2400); return ()=>clearTimeout(t);} },[toast]);

  const NAV=[['dash','Dashboard','grid'],['sched','Schedule','cal'],['enroll','Enrollment','enroll'],['dancers','Dancers','users'],['staff','Faculty','staff'],['billing','Billing','dollar'],['comms','Comms','bell']];
  return (
    <React.Fragment>
      {/* sidebar */}
      <aside className="side">
        <div className="brand"><div className="mark">M</div><div><div className="nm">MLDA</div><div className="sub">Collective · Admin</div></div></div>
        <div className="navlbl">Studio</div>
        <nav className="nav">
          {NAV.slice(0,5).map(([k,l,ic])=>(
            <button key={k} className={'navitem'+(view===k?' on':'')} onClick={()=>setView(k)}><Icon n={ic} w={19}/>{l}{k==='enroll'&&<span className="badge">6</span>}{k==='staff'&&<span className="badge">1</span>}</button>
          ))}
        </nav>
        <div className="navlbl">Operations</div>
        <nav className="nav">
          {NAV.slice(5).map(([k,l,ic])=>(
            <button key={k} className={'navitem'+(view===k?' on':'')} onClick={()=>setView(k)}><Icon n={ic} w={19}/>{l}</button>
          ))}
        </nav>
        <div className="side-foot"><Av n="Dana Cole" size={34}/><div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:600}}>Dana Cole</div><div style={{fontSize:10.5,color:'var(--muted-2)'}}>Studio Director</div></div></div>
      </aside>

      {/* main */}
      <main className="main">
        <header className="topbar">
          <div className="search"><Icon n="search" w={16} style={{color:'var(--muted-2)'}}/><input placeholder="Search dancers, classes, families…"/></div>
          <div style={{marginLeft:'auto',display:'flex',gap:10,alignItems:'center'}}>
            <div className="iconbtn" onClick={()=>setView('comms')}><Icon n="send" w={17}/></div>
            <div className="iconbtn"><Icon n="bell" w={17}/><span style={{position:'absolute',top:8,right:9,width:7,height:7,borderRadius:'50%',background:'var(--coral)'}}/></div>
          </div>
        </header>
        <div className="canvas">
          {view==='dash' && <Dashboard setToast={setToast} go={setView} setModal={setModal}/>}
          {view==='sched' && <ScheduleView setModal={setModal}/>}
          {view==='enroll' && <Enrollment setToast={setToast}/>}
          {view==='staff' && <Staff setToast={setToast}/>}
          {view==='billing' && <Billing/>}
          {view==='comms' && <Comms setToast={setToast}/>}
          {view==='dancers' && <Enrollment setToast={setToast}/>}
        </div>
      </main>

      {modal && <ClassModal data={modal} close={()=>setModal(null)} setToast={setToast}/>}
      {toast && <div className="toast"><Icon n="check" w={16} style={{color:'#06110f'}}/>{toast}</div>}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

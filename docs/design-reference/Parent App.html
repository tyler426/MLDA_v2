<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MLDA Collective — Parent App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700;6..96,800;6..96,900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0e0d0c;
    --bg-2:#16140f;
    --bg-3:#1d1a15;
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.14);
    --gold:#c8a464;
    --gold-soft:rgba(200,164,100,.14);
    --teal:#2c9089;
    --teal-bright:#3aa89f;
    --teal-deep:#1f7570;
    --teal-soft:rgba(44,144,137,.16);
    --teal-line:rgba(58,168,159,.35);
    --coral:#d97a5e;
    --bone:#efe9df;
    --muted:#a89e90;
    --muted-2:#7d756a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0a0908;
    background-image:radial-gradient(circle at 50% 0%, #1a1712, #0a0908 60%);
    min-height:100vh;
    font-family:'Archivo',system-ui,sans-serif;
    color:var(--bone);
    display:flex; flex-direction:column; align-items:center;
    padding:34px 16px 60px;
  }
  .stage-label{ text-align:center; margin-bottom:24px; }
  .stage-label .eb{ font-size:10px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); }
  .stage-label h1{ font-family:'Bodoni Moda',serif; font-weight:500; font-size:22px; margin-top:6px; color:var(--bone); }
  .stage-label p{ font-size:12.5px; color:var(--muted-2); margin-top:4px; }

  /* phone */
  .phone{
    width:392px; height:812px;
    border-radius:52px; padding:13px;
    background:linear-gradient(160deg,#2b2824,#0f0e0c);
    box-shadow:0 50px 90px -40px rgba(0,0,0,.8), 0 6px 14px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.05);
    position:relative; flex:0 0 auto;
  }
  .notch{ position:absolute; top:13px; left:50%; transform:translateX(-50%); width:118px; height:30px; background:#000; border-radius:0 0 18px 18px; z-index:60; }
  .screen{
    width:100%; height:100%; border-radius:40px; overflow:hidden;
    background:var(--bg); position:relative; display:flex; flex-direction:column;
  }
  .statusbar{
    height:48px; flex:0 0 48px; display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 26px 6px; font-size:13px; font-weight:600; z-index:20; position:relative;
  }
  .statusbar .r{ display:flex; gap:6px; align-items:center; }
  .bar{ width:17px; height:11px; border-radius:2px; background:var(--bone); display:inline-block; }
  .dot{ width:11px; height:11px; border-radius:50%; border:2px solid var(--bone); display:inline-block; }

  .view{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .view::-webkit-scrollbar{ display:none; }
  .pad{ padding:0 20px; }

  /* tab bar */
  .tabbar{
    flex:0 0 84px; display:flex; align-items:flex-start; justify-content:space-around;
    padding:12px 8px 0; background:rgba(14,13,12,.92); backdrop-filter:blur(12px);
    border-top:1px solid var(--line); position:relative; z-index:30;
  }
  .tab{ display:flex; flex-direction:column; align-items:center; gap:5px; font-size:9.5px; letter-spacing:.02em;
    color:var(--muted-2); background:none; border:0; cursor:pointer; font-family:inherit; padding:4px 10px; transition:color .18s; }
  .tab svg{ width:23px; height:23px; }
  .tab.active{ color:var(--teal-bright); }
  .tab .fab{ width:48px; height:48px; margin-top:-22px; border-radius:50%; background:linear-gradient(160deg,var(--teal-bright),var(--teal-deep));
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 22px -8px rgba(44,144,137,.8); }
  .tab .fab svg{ width:24px; height:24px; color:#06110f; }

  /* atoms */
  .eyebrow{ font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .eyebrow.teal{ color:var(--teal-bright); }
  .serif{ font-family:'Bodoni Moda',serif; }
  .card{ background:var(--bg-2); border:1px solid var(--line); border-radius:18px; }
  .ph{ background-image:repeating-linear-gradient(135deg,rgba(200,164,100,.07) 0 9px,transparent 9px 18px); background-color:#181511;
    display:flex; align-items:flex-end; color:#6f6048; font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
  .chip{ font-size:11px; padding:4px 11px; border-radius:30px; background:rgba(255,255,255,.07); color:var(--muted); }
  .divider{ height:1px; background:var(--line); margin:0 20px; }

  .fade{ animation:fade .32s ease both; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* sheet */
  .sheet-bg{ position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:70; display:flex; align-items:flex-end; animation:fade .2s ease both; }
  .sheet{ width:100%; background:var(--bg-2); border-radius:28px 28px 40px 40px; border:1px solid var(--line); border-bottom:0;
    padding:10px 20px 28px; max-height:86%; overflow-y:auto; animation:up .3s cubic-bezier(.2,.8,.2,1) both; }
  .sheet::-webkit-scrollbar{ display:none; }
  @keyframes up{ from{transform:translateY(40px); opacity:.4;} to{transform:translateY(0); opacity:1;} }
  .grab{ width:38px; height:4px; border-radius:4px; background:var(--line-2); margin:6px auto 14px; }

  .seg{ display:flex; gap:6px; background:var(--bg-3); border:1px solid var(--line); border-radius:30px; padding:4px; }
  .seg button{ flex:1; border:0; background:none; color:var(--muted); font-family:inherit; font-size:11.5px; font-weight:600; padding:7px 0; border-radius:24px; cursor:pointer; transition:.18s; }
  .seg button.on{ background:var(--teal); color:#06110f; }

  .toast{ position:absolute; left:20px; right:20px; bottom:100px; z-index:90; background:var(--teal); color:#06110f;
    border-radius:14px; padding:13px 16px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px;
    box-shadow:0 16px 34px -14px rgba(44,144,137,.8); animation:up .3s ease both; }
</style>
</head>
<body>
  <div class="stage-label">
    <div class="eb">MLDA Collective · Parent App</div>
    <h1>Spotlight</h1>
    <p>Interactive — switch dancers, browse the schedule, tap any class or the competition tracker.</p>
  </div>
  <div class="phone">
    <div class="notch"></div>
    <div id="root" class="screen"></div>
  </div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ---------------- icons ---------------- */
const I = {
  home:   <path d="M3 11l9-8 9 8M5 10v10h14V10" />,
  cal:    <g><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></g>,
  trophy: <g><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M9 14h6M10 14v3M14 14v3M8 21h8"/></g>,
  mail:   <g><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></g>,
  user:   <g><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></g>,
  clock:  <g><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>,
  pin:    <g><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></g>,
  chev:   <path d="M9 6l6 6-6 6" />,
  check:  <path d="M5 12l5 5L20 6" />,
  music:  <g><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g>,
  bell:   <g><path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 7H3s3 0 3-7"/><path d="M10 20a2 2 0 0 0 4 0"/></g>,
  plus:   <path d="M12 5v14M5 12h14" />,
  card:   <g><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></g>,
  shirt:  <path d="M16 3l4 3-2 4-2-1v12H8V9L6 10 4 6l4-3 2 2h4z" />,
  spark:  <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />,
};
const Icon = ({n, w=22, sw=1.6, fill="none", style}) =>
  <svg viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{width:w,height:w,...style}}>{I[n]}</svg>;

/* ---------------- data ---------------- */
const DANCERS = [
  { id:'ava', name:'Ava', full:'Ava Whitman', level:'Senior Elite', initial:'A', color:'#2c9089', team:'Company' },
  { id:'mia', name:'Mia', full:'Mia Whitman', level:'Junior', initial:'M', color:'#c8a464', team:'Petite' },
];

const STYLE_COLOR = { Ballet:'#2c9089', Contemporary:'#7c6fcf', Jazz:'#c8a464', HipHop:'#d97a5e', Tap:'#5a9bd4', Lyrical:'#cf6f9c', Technique:'#2c9089' };

const SCHED = {
  ava: {
    Mon: [{t:'4:30',e:'5:30',n:'Ballet Technique',st:'Studio B',teach:'Ms. Elena',sty:'Ballet'},
          {t:'5:30',e:'7:00',n:'Company Contemporary',st:'Studio A',teach:'Mr. Théo',sty:'Contemporary'}],
    Tue: [{t:'5:00',e:'6:30',n:'Competition Jazz',st:'Studio A',teach:'Ms. Renée',sty:'Jazz'}],
    Wed: [{t:'4:30',e:'5:30',n:'Pointe',st:'Studio B',teach:'Ms. Elena',sty:'Ballet'},
          {t:'6:00',e:'7:30',n:'Lyrical Ensemble',st:'Studio C',teach:'Ms. Renée',sty:'Lyrical'}],
    Thu: [],
    Fri: [{t:'4:00',e:'6:00',n:'Company Rehearsal',st:'Main Stage',teach:'Mr. Théo',sty:'Contemporary'}],
    Sat: [{t:'10:00',e:'11:30',n:'Hip-Hop',st:'Studio C',teach:'DJ Marcus',sty:'HipHop'},
          {t:'12:00',e:'1:00',n:'Private — Solo',st:'Studio B',teach:'Ms. Elena',sty:'Technique'}],
    Sun: [],
  },
  mia: {
    Mon: [{t:'4:00',e:'4:45',n:'Pre-Ballet',st:'Studio C',teach:'Ms. Joy',sty:'Ballet'}],
    Tue: [], Wed: [{t:'4:00',e:'5:00',n:'Petite Jazz',st:'Studio C',teach:'Ms. Joy',sty:'Jazz'}], Thu: [],
    Fri: [], Sat: [{t:'9:00',e:'9:45',n:'Tumbling',st:'Studio A',teach:'Coach Bri',sty:'Tap'}], Sun: [],
  }
};
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const todayIdx = 2; // Wed

const COMPS = [
  { id:'nats', name:'Nationals', city:'Orlando, FL', days:24, accent:'#c8a464', routines:5,
    range:'Jun 24 – 28', venue:'Gaylord Palms Resort' },
  { id:'kar', name:'KAR Regionals', city:'Atlanta, GA', days:9, accent:'#2c9089', routines:3,
    range:'Jun 9 – 11', venue:'Cobb Energy Centre' },
];
const COSTUMES = [
  { r:'Contemporary — "Tides"', paid:true,  fitted:true },
  { r:'Jazz — "Voltage"',        paid:true,  fitted:false },
  { r:'Lyrical — "Still Here"',  paid:false, fitted:false },
];
const ROUTINES = [
  { n:'Tides', sty:'Contemporary', len:'2:45', call:'1:10 PM', teach:'Mr. Théo' },
  { n:'Voltage', sty:'Jazz', len:'2:30', call:'2:40 PM', teach:'Ms. Renée' },
  { n:'Still Here', sty:'Lyrical', len:'3:00', call:'4:05 PM', teach:'Ms. Renée' },
];

const ANNOUNCE = [
  { id:1, pin:true, from:'MLDA Front Desk', tag:'Costumes', time:'2h', title:'Nationals costume balance due Friday',
    body:'Final costume payments for Orlando are due this Friday 6/6. Tap to settle the “Still Here” lyrical balance.', cta:'Pay $145 balance', accent:'#c8a464' },
  { id:2, pin:false, from:'Ms. Elena', tag:'Ballet', time:'5h', title:'Pointe shoes — bring a second pair Wed',
    body:'Ava’s ribbons are wearing through. Please send a backup pair for Wednesday’s pointe class.', accent:'#2c9089' },
  { id:3, pin:false, from:'MLDA Front Desk', tag:'Recital', time:'1d', title:'Spring recital tickets are live',
    body:'Reserved seating for the June 14 showcase is open now. Company families get a 24-hour presale window.', cta:'Reserve seats', accent:'#2c9089' },
  { id:4, pin:false, from:'Mr. Théo', tag:'Company', time:'2d', title:'Extra rehearsal added Sunday',
    body:'We’ll run “Tides” cleaning 1–3 PM on the Main Stage ahead of Regionals. Optional but strongly encouraged.', accent:'#7c6fcf' },
];

/* ---------------- small components ---------------- */
function Avatar({d, size=38, ring}){
  return <div style={{width:size,height:size,borderRadius:'50%',flex:`0 0 ${size}px`,
    background:ring?'transparent':d.color, border:ring?`1.5px solid ${d.color}`:'none',
    color:ring?d.color:'#0a0908', display:'flex',alignItems:'center',justifyContent:'center',
    fontFamily:'Bodoni Moda, serif', fontSize:size*0.42, fontWeight:600}}>{d.initial}</div>;
}
function StyleDot({sty}){ return <span style={{width:7,height:7,borderRadius:'50%',background:STYLE_COLOR[sty]||'#888',display:'inline-block'}}/>; }

/* ---------------- Home ---------------- */
function Home({dancer, setDancer, go, openClass}){
  const today = SCHED[dancer.id][DAYS[todayIdx]] || [];
  const next = today[0];
  const comp = COMPS[0];
  return (
    <div className="view fade">
      <div className="pad" style={{paddingTop:4, display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div className="eyebrow">MLDA Collective</div>
          <div className="serif" style={{fontSize:25,fontWeight:600,marginTop:3}}>Evening, Dana</div>
        </div>
        <button onClick={()=>go('you')} style={{background:'none',border:0,cursor:'pointer'}}><Avatar d={DANCERS[0]} ring/></button>
      </div>

      {/* dancer switcher */}
      <div className="pad" style={{display:'flex',gap:8,marginTop:16}}>
        {DANCERS.map(d=>{
          const on = d.id===dancer.id;
          return <button key={d.id} onClick={()=>setDancer(d)} style={{display:'flex',alignItems:'center',gap:8,
            border:on?`1px solid ${d.color}`:'1px solid var(--line)', background:on?'var(--teal-soft)':'transparent',
            borderRadius:30, padding:'5px 13px 5px 5px', cursor:'pointer', fontFamily:'inherit'}}>
            <Avatar d={d} size={26}/>
            <span style={{color:on?'var(--bone)':'var(--muted)',fontSize:13,fontWeight:600}}>{d.name}</span>
          </button>;
        })}
        <button style={{width:36,height:36,borderRadius:'50%',border:'1px dashed var(--line-2)',background:'none',color:'var(--muted-2)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon n="plus" w={16}/></button>
      </div>

      {/* up next hero */}
      <div className="pad" style={{marginTop:18}}>
        <div className="eyebrow teal" style={{marginBottom:9}}>Up next · Today</div>
        {next ? (
          <button onClick={()=>openClass(next)} style={{display:'block',width:'100%',textAlign:'left',padding:0,border:0,cursor:'pointer',background:'none'}}>
          <div style={{borderRadius:20,overflow:'hidden',border:'1px solid var(--teal-line)',background:'linear-gradient(180deg,#19211f,#121311)',boxShadow:'0 0 0 4px var(--teal-soft)'}}>
            <div className="ph" style={{height:120,padding:'9px 12px',backgroundColor:'#13211f',backgroundImage:'repeating-linear-gradient(135deg,rgba(58,168,159,.1) 0 9px,transparent 9px 18px)'}}>Dancer photo · {dancer.name}</div>
            <div style={{padding:'14px 16px 16px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{display:'flex',alignItems:'center',gap:7,fontSize:11,color:'var(--muted)'}}><Icon n="clock" w={14} style={{color:'var(--teal-bright)'}}/>{next.t}–{next.e} PM</span>
                <span className="chip" style={{background:'var(--teal-soft)',color:'var(--teal-bright)'}}>{next.st}</span>
              </div>
              <div className="serif" style={{fontSize:27,fontWeight:600,margin:'9px 0 4px'}}>{next.n}</div>
              <div style={{fontSize:12.5,color:'var(--muted)'}}>with {next.teach}</div>
            </div>
          </div>
          </button>
        ) : <div className="card" style={{padding:'22px 18px',textAlign:'center',color:'var(--muted-2)',fontSize:13}}>No classes today — rest day for {dancer.name}.</div>}
      </div>

      {/* week strip */}
      <div className="pad" style={{marginTop:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div className="eyebrow" style={{color:'var(--muted-2)'}}>This week</div>
          <button onClick={()=>go('sched')} style={{background:'none',border:0,color:'var(--teal-bright)',fontSize:11.5,fontFamily:'inherit',cursor:'pointer',display:'flex',alignItems:'center',gap:3}}>Full schedule <Icon n="chev" w={13}/></button>
        </div>
        <div style={{display:'flex',gap:6}}>
          {DAYS.slice(0,7).map((d,i)=>{
            const cls = SCHED[dancer.id][d]||[]; const on=i===todayIdx;
            return <button key={d} onClick={()=>go('sched')} style={{flex:1,border:0,cursor:'pointer',fontFamily:'inherit',
              background:on?'var(--teal)':'var(--bg-2)', color:on?'#06110f':'var(--muted)', borderRadius:12, padding:'9px 0 8px', textAlign:'center'}}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'.04em'}}>{d[0]}</div>
              <div style={{display:'flex',gap:3,justifyContent:'center',marginTop:7,minHeight:6}}>
                {cls.slice(0,3).map((c,j)=><span key={j} style={{width:5,height:5,borderRadius:'50%',background:on?'#06110f':STYLE_COLOR[c.sty]}}/>)}
              </div>
            </button>;
          })}
        </div>
      </div>

      {/* competition countdown */}
      <div className="pad" style={{marginTop:20}}>
        <button onClick={()=>go('comp')} style={{display:'block',width:'100%',textAlign:'left',border:0,cursor:'pointer',background:'none',padding:0}}>
        <div className="card" style={{borderColor:'rgba(200,164,100,.3)',background:'linear-gradient(180deg,#1c1813,#141210)',padding:'16px 18px',display:'flex',alignItems:'center',gap:16}}>
          <div style={{textAlign:'center'}}>
            <div className="serif" style={{fontSize:44,lineHeight:.85,color:'var(--gold)'}}>{comp.days}</div>
            <div style={{fontSize:8.5,letterSpacing:'.18em',color:'var(--muted-2)',marginTop:2}}>DAYS</div>
          </div>
          <div style={{flex:1,borderLeft:'1px solid var(--line)',paddingLeft:15}}>
            <div className="eyebrow">Next competition</div>
            <div className="serif" style={{fontSize:19,fontWeight:600,margin:'4px 0 3px'}}>{comp.name} · {comp.city.split(',')[0]}</div>
            <div style={{fontSize:11.5,color:'var(--muted)'}}>{comp.routines} routines · costumes due Fri</div>
          </div>
          <Icon n="chev" w={18} style={{color:'var(--muted-2)'}}/>
        </div>
        </button>
      </div>

      {/* announcement */}
      <div className="pad" style={{marginTop:14,marginBottom:18}}>
        <button onClick={()=>go('inbox')} style={{display:'flex',width:'100%',alignItems:'center',gap:12,background:'none',border:0,cursor:'pointer',padding:0,textAlign:'left'}}>
          <div style={{width:40,height:40,borderRadius:12,background:'var(--gold-soft)',color:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',flex:'0 0 40px'}}><Icon n="bell" w={19}/></div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:600,color:'var(--bone)'}}>Costume balance due Friday</div>
            <div style={{fontSize:11.5,color:'var(--muted-2)'}}>Front Desk · 2h ago</div>
          </div>
          <Icon n="chev" w={16} style={{color:'var(--muted-2)'}}/>
        </button>
      </div>
    </div>
  );
}

/* ---------------- Schedule ---------------- */
function Schedule({dancer, openClass}){
  const [day,setDay] = useState(DAYS[todayIdx]);
  const list = SCHED[dancer.id][day]||[];
  return (
    <div className="view fade">
      <div className="pad" style={{paddingTop:4}}>
        <div className="eyebrow teal">Schedule</div>
        <div className="serif" style={{fontSize:25,fontWeight:600,marginTop:3}}>{dancer.name}’s week</div>
      </div>
      <div className="pad" style={{display:'flex',gap:6,marginTop:16,overflowX:'auto'}}>
        {DAYS.map((d,i)=>{
          const on=d===day; const has=(SCHED[dancer.id][d]||[]).length;
          return <button key={d} onClick={()=>setDay(d)} style={{flex:'0 0 auto',minWidth:44,border:0,cursor:'pointer',fontFamily:'inherit',
            background:on?'var(--teal)':'var(--bg-2)',color:on?'#06110f':has?'var(--bone)':'var(--muted-2)',borderRadius:14,padding:'10px 0',textAlign:'center'}}>
            <div style={{fontSize:10,fontWeight:700,opacity:.7}}>{d.toUpperCase()}</div>
            <div className="serif" style={{fontSize:18,fontWeight:600,marginTop:2}}>{14+i}</div>
            {i===todayIdx && <div style={{fontSize:8,marginTop:2,letterSpacing:'.1em',color:on?'#06110f':'var(--teal-bright)'}}>TODAY</div>}
          </button>;
        })}
      </div>

/* ---------------- Class detail sheet ---------------- */
function ClassSheet({c, dancer, close, setToast}){
  if(!c) return null;
  return (
    <div className="sheet-bg" onClick={close}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"/>
        <div style={{display:'flex',alignItems:'center',gap:8}}><StyleDot sty={c.sty}/><span style={{fontSize:9.5,letterSpacing:'.14em',textTransform:'uppercase',color:STYLE_COLOR[c.sty]}}>{c.sty}</span></div>
        <div className="serif" style={{fontSize:30,fontWeight:600,margin:'8px 0 14px'}}>{c.n}</div>
        <div style={{display:'flex',gap:10,marginBottom:16}}>
          <div style={{flex:1,padding:'12px 14px',borderRadius:13,background:'var(--bg-3)'}}>
            <div className="eyebrow" style={{color:'var(--muted-2)'}}>Time</div>
            <div className="serif" style={{fontSize:18,marginTop:4}}>{c.t}–{c.e} PM</div>
          </div>
          <div style={{flex:1,padding:'12px 14px',borderRadius:13,background:'var(--bg-3)'}}>
            <div className="eyebrow" style={{color:'var(--muted-2)'}}>Studio</div>
            <div className="serif" style={{fontSize:18,marginTop:4}}>{c.st}</div>
          </div>
        </div>
        <div className="card" style={{padding:'14px 15px',display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{width:42,height:42,borderRadius:'50%',background:'var(--teal-soft)',color:'var(--teal-bright)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Bodoni Moda,serif',fontSize:18}}>{c.teach.split(' ').slice(-1)[0][0]}</div>
          <div><div style={{fontSize:14,fontWeight:600}}>{c.teach}</div><div style={{fontSize:11.5,color:'var(--muted-2)'}}>Instructor</div></div>
          <button onClick={()=>setToast('Message sent to '+c.teach)} style={{marginLeft:'auto',background:'var(--bg-3)',border:'1px solid var(--line-2)',color:'var(--bone)',borderRadius:20,padding:'8px 14px',fontSize:12,fontFamily:'inherit',cursor:'pointer'}}>Message</button>
        </div>
        <div className="eyebrow" style={{color:'var(--muted-2)',marginBottom:8}}>Bring to class</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:20}}>
          {['Pointe shoes','Black leo','Hair in bun','Water'].map(x=><span key={x} className="chip" style={{background:'var(--bg-3)'}}>{x}</span>)}
        </div>
        <button onClick={()=>{setToast(dancer.name+' marked absent — Ms. '+c.teach.split(' ').slice(-1)[0]+' notified'); close();}} style={{width:'100%',background:'var(--teal)',color:'#06110f',border:0,borderRadius:14,padding:'14px',fontSize:14,fontWeight:700,fontFamily:'inherit',cursor:'pointer'}}>Report an absence</button>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [tab,setTab] = useState(()=>localStorage.getItem('mlda_tab')||'home');
  const [dancer,setDancer] = useState(DANCERS[0]);
  const [cls,setCls] = useState(null);
  const [toast,setToast] = useState(null);
  useEffect(()=>{ localStorage.setItem('mlda_tab',tab); },[tab]);
  useEffect(()=>{ if(toast){ const t=setTimeout(()=>setToast(null),2400); return ()=>clearTimeout(t);} },[toast]);

  const TABS = [['home','Home','home'],['sched','Schedule','cal'],['comp','Compete','trophy'],['inbox','Inbox','mail'],['you','You','user']];

  return (
    <React.Fragment>
      <div className="statusbar">
        <span>9:41</span>
        <span className="r"><span style={{fontSize:11,letterSpacing:'.05em'}}></span><span className="bar"/><span className="dot"/></span>
      </div>
      {tab==='home'  && <Home dancer={dancer} setDancer={setDancer} go={setTab} openClass={setCls}/>}
      {tab==='sched' && <Schedule dancer={dancer} openClass={setCls}/>}
      {tab==='comp'  && <Competitions setToast={setToast}/>}
      {tab==='inbox' && <Inbox setToast={setToast}/>}
      {tab==='you'   && <You setToast={setToast}/>}

      {cls && <ClassSheet c={cls} dancer={dancer} close={()=>setCls(null)} setToast={setToast}/>}
      {toast && <div className="toast"><Icon n="check" w={17} style={{color:'#06110f'}}/>{toast}</div>}

      <div className="tabbar">
        {TABS.map(([k,l,ic])=>(
          <button key={k} className={'tab'+(tab===k?' active':'')} onClick={()=>setTab(k)}>
            <Icon n={ic} w={23} sw={tab===k?2:1.6}/>
            <span>{l}</span>
          </button>
        ))}
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
